name: Build and Publish API Container

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./src/MultilingualFileProcessingPlatform.Api
          file: ./src/MultilingualFileProcessingPlatform.Api/Dockerfile
          push: true
          tags: ghcr.io/hannahhh26/multilingual-file-processing-platform-api:latest
